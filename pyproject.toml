[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-file-watcher"
version = "0.1.0"
description = "Windows tray watcher that downloads new Telegram group files"
requires-python = ">=3.11"
dependencies = [
    "Telethon==1.44.0",
    "cryptg==0.6.0",
    "Pillow==12.3.0",
    "pystray==0.19.5",
    "python-dotenv==1.2.2",
]

[project.scripts]
telegram-file-watcher = "telegram_file_watcher.__main__:main"
telegram-file-watcher-configure = "telegram_file_watcher.configure:main"
telegram-file-watcher-service = "telegram_file_watcher.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
