[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-file-downloader"
version = "1.1.0"
description = "Docker service that downloads allowed files from a Telegram channel or group"
requires-python = ">=3.11"
dependencies = [
    "Telethon==1.44.0",
    "cryptg==0.6.0",
    "python-dotenv==1.2.2",
    "python-socks[asyncio]>=2.4,<3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "Pillow==13.0.0",
]

[project.scripts]
telegram-file-downloader-configure = "telegram_file_downloader.configure:main"
telegram-file-downloader-service = "telegram_file_downloader.service:main"
telegram-file-downloader-web = "telegram_file_downloader.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_file_downloader = ["static/**/*", "static/*"]
