name: tg-group-watcher

services:
  watcher:
    image: ghcr.io/kazeliu/telegram-file-downloader:latest
    environment:
      ENV_FILE_PATH: /config/.env
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      IN_DOCKER: "true"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./downloads:/downloads
    stdin_open: true
    tty: true
    restart: unless-stopped
